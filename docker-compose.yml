version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autocontent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  script-service:
    build:
      context: .
      dockerfile: services/script_service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/autocontent
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  video-service:
    build:
      context: .
      dockerfile: services/video_service/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - VIDEO_PROVIDER=${VIDEO_PROVIDER:-veo}
      - VIDU_API_KEY=${VIDU_API_KEY}
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
    volumes:
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
    
  assembly-service:
    build:
      context: .
      dockerfile: services/assembly_service/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}

  publish-service:
    build:
      context: .
      dockerfile: services/publish_service/Dockerfile
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/autocontent
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    depends_on:
      db:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http publish-service:8000
    ports:
      - "4040:4040"
    depends_on:
      - publish-service

volumes:
  pgdata:
